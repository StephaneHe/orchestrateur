<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    
    <linearGradient id="mx-deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061008"></stop>
      <stop offset="1" stop-color="#000000"></stop>
    </linearGradient>
    <linearGradient id="mx-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3ffc8"></stop>
      <stop offset="0.45" stop-color="#2dff7a"></stop>
      <stop offset="1" stop-color="#00c247"></stop>
    </linearGradient>
    
    <linearGradient id="mx-rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dff7a" stop-opacity="0"></stop>
      <stop offset="0.15" stop-color="#2dff7a" stop-opacity="0.1"></stop>
      <stop offset="0.7" stop-color="#2dff7a" stop-opacity="0.55"></stop>
      <stop offset="0.95" stop-color="#ffffff" stop-opacity="1"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"></stop>
    </linearGradient>

    
    <pattern id="mx-scan" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="transparent"></rect>
      <rect y="1.5" width="3" height="0.8" fill="rgba(45,255,122,0.05)"></rect>
    </pattern>

    
    <radialGradient id="mx-vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0" stop-color="rgba(45,255,122,0.18)"></stop>
      <stop offset="0.5" stop-color="rgba(45,255,122,0.04)"></stop>
      <stop offset="1" stop-color="rgba(0,0,0,0)"></stop>
    </radialGradient>

    <filter id="mx-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="mx-glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"></feGaussianBlur>
      <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>

    
    <clipPath id="mx-clip">
      <rect width="512" height="512" rx="112" ry="112"></rect>
    </clipPath>

    
    
  </defs>

  
  <rect width="512" height="512" rx="112" ry="112" fill="url(#mx-deep)"></rect>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#mx-vig)"></rect>

  
